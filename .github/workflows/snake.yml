name: snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7E22CE&color_dots=#EBEDF0,#BBF7D0,#4ADE80,#16A34A,#14532D
            dist/snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#161B22,#14532D,#15803D,#22C55E,#86EFAC
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
