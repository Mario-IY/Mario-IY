<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="0.8" stop-color="#22C55E" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E6EDF3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#base)"/>
  <rect y="9" width="160" height="6" rx="3" fill="url(#spark)" filter="url(#blur)">
    <animate attributeName="x" values="-160;1200" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="12" r="4" fill="#0D1117" stroke="#A855F7" stroke-width="2">
    <animate attributeName="stroke" values="#A855F7;#22C55E;#A855F7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
