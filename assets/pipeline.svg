      <circle cx="140" cy="88" r="6" fill="#A855F7"/>
      <text x="140" y="44" font-family="Consolas, Menlo, monospace" font-size="14" fill="#6E7681">01</text>
      <text x="140" y="138" font-size="17" font-weight="700" fill="#E6EDF3">Entender</text>
