        <animate attributeName="stroke" values="#30363D;#30363D;#7C8CB8;#7C8CB8;#30363D" keyTimes="0;0.42;0.44;0.95;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="88" r="6" fill="#30363D">
        <animate attributeName="fill" values="#30363D;#30363D;#7C8CB8;#7C8CB8;#30363D" keyTimes="0;0.42;0.44;0.95;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text x="600" y="44" font-family="Consolas, Menlo, monospace" font-size="14" fill="#6E7681">03</text>
      <text x="600" y="138" font-size="17" font-weight="700" fill="#E6EDF3">Construir</text>
      <text x="600" y="162" font-size="14" fill="#8B949E">y probar en test</text>
    </g>
    <g>
