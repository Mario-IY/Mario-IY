        <animate attributeName="fill" values="#30363D;#30363D;#22C55E;#22C55E;#30363D" keyTimes="0;0.84;0.86;0.95;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text x="1060" y="44" font-family="Consolas, Menlo, monospace" font-size="14" fill="#6E7681">05</text>
      <text x="1060" y="138" font-size="17" font-weight="700" fill="#E6EDF3">Documentar</text>
