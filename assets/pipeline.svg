      <text x="830" y="138" font-size="17" font-weight="700" fill="#E6EDF3">Producción</text>
      <text x="830" y="162" font-size="14" fill="#8B949E">y monitoreo</text>
    </g>
    <g>
      <circle cx="1060" cy="88" r="16" fill="#161B22" stroke="#30363D" stroke-width="2">
        <animate attributeName="stroke" values="#30363D;#30363D;#22C55E;#22C55E;#30363D" keyTimes="0;0.84;0.86;0.95;1" dur="6s" repeatCount="indefinite"/>
