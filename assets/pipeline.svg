      </circle>
      <circle cx="370" cy="88" r="6" fill="#30363D">
        <animate attributeName="fill" values="#30363D;#30363D;#B07CF0;#B07CF0;#30363D" keyTimes="0;0.21;0.23;0.95;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text x="370" y="44" font-family="Consolas, Menlo, monospace" font-size="14" fill="#6E7681">02</text>
