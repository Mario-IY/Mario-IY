<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210">
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="209" rx="18" fill="#0D1117" stroke="#30363D"/>

  <line x1="140" y1="88" x2="1060" y2="88" stroke="#30363D" stroke-width="2"/>
  <line x1="140" y1="88" x2="1060" y2="88" stroke="url(#track)" stroke-width="2" stroke-dasharray="920" stroke-dashoffset="920">
    <animate attributeName="stroke-dashoffset" values="920;0;0" keyTimes="0;0.85;1" dur="6s" repeatCount="indefinite"/>
  </line>

  <circle cy="88" r="10" fill="#22C55E" filter="url(#blur)">
    <animate attributeName="cx" values="140;1060;1060" keyTimes="0;0.85;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="6s" repeatCount="indefinite"/>
  </circle>

